name: Enterprise checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    # 项目默认方言是 MySQL（docker-compose 与 scripts/install.mjs 一致），
    # CI 跟随默认路径：用空库验证 prisma/migrations 能完整建表。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_DATABASE: enterprise_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pisolated-ci-only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # runner 上下文不能用在 job 级 env（会让整个 workflow 校验失败、不产生任何 job），
      # 临时目录改为在步骤里导出给后续步骤使用。
      - run: echo "ENTERPRISE_TEMP_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enterprise/contracts build
      - run: node scripts/check-architecture.mjs
      - run: pnpm test:environment
      # OpenAPI 生成会构造 PrismaClient 与服务容器（不真正连库），缺少必填配置会直接抛错；
      # 这里注入占位连接串与临时密钥，方言与本地快照生成时保持一致（mysql）。
      - run: pnpm api:docs:check
        env:
          DB_PROVIDER: mysql
          DATABASE_URL: mysql://docs:docs@127.0.0.1:3306/docs
          JWT_SECRET: isolated-ci-signing-key-20261103
          EXTERNAL_CRED_KEY: isolated-ci-credential-encryption-key
      - run: pnpm typecheck
      # 存量 lint 债务（约 690 条，绝大部分是 Windows CRLF 触发 prettier 与少量规则项）：
      # 不阻塞构建/部署验证，结果照常输出，后续逐步清零后再改为硬门禁。
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm --filter aiworkin-enterprise-api test --runInBand
      - run: pnpm test:uploads
      # 默认 MySQL 路径的建表校验：空库从 0001 依次执行到最新。
      - run: pnpm --filter aiworkin-enterprise-api exec prisma migrate deploy
        env:
          DB_PROVIDER: mysql
          DATABASE_URL: mysql://root:isolated-ci-only@127.0.0.1:3306/enterprise_ci
      # 以下集成脚本面向 PostgreSQL 一次性空库（test-isolated-migration 依赖 createdb，
      # test/query-plans 使用 EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)），
      # 与默认 MySQL 方言不兼容，保留为本地按需执行：
      #   pnpm test:regression / pnpm test:query-plans
      #   pnpm test:performance / pnpm test:geo-recovery
      - run: pnpm build
