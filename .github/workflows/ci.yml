name: Enterprise checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      # runner 上下文不能用在 job 级 env（会让整个 workflow 校验失败、不产生任何 job），
      # 临时目录改为在步骤里导出给后续步骤使用。
      - run: echo "ENTERPRISE_TEMP_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enterprise/contracts build
      - run: node scripts/check-architecture.mjs
      - run: pnpm test:environment
      - run: pnpm api:docs:check
      - run: pnpm typecheck
      # 存量 lint 债务（约 690 条，绝大部分是 Windows CRLF 触发 prettier 与少量规则项）：
      # 不阻塞构建/部署验证，结果照常输出，后续逐步清零后再改为硬门禁。
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm --filter aiworkin-enterprise-api test --runInBand
      - run: pnpm test:uploads
      - run: node scripts/test-isolated-migration.mjs --full
      - run: pnpm test:query-plans
      - run: node scripts/verify-geo-collection-recovery.mjs
      - run: pnpm test:performance
      - run: pnpm build
