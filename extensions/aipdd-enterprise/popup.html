<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AIPDD Enterprise</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font: 13px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2329;
      background: #fff;
    }
    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eee;
    }
    h1 { margin: 0; font-size: 15px; }
    .ver { color: #8a919f; font-size: 12px; }
    main { padding: 12px 16px 16px; }
    ol { margin: 0; padding-left: 18px; }
    li { margin-bottom: 6px; }
    .tip {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f5f6f7;
      border-radius: 6px;
      color: #55606b;
    }
    .trust {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #e6e8eb;
      border-radius: 8px;
    }
    .trust-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #55606b;
    }
    .trust-origin {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #1f2329;
    }
    .trust-btn {
      margin-top: 8px;
      width: 100%;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      background: #1677ff;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .trust-btn.off {
      background: #f5f6f7;
      color: #55606b;
      border: 1px solid #e6e8eb;
    }
    .trust-status {
      margin-top: 6px;
      font-size: 11px;
      color: #8a919f;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>AIPDD Enterprise 分发助手</h1>
    <div class="ver">v1.2.0 · 多平台内容分发</div>
  </header>
  <main>
    <ol>
      <li>先在浏览器里登录目标平台（微博/小红书/抖音/快手/视频号/知识星球/知乎/今日头条/百家号/B站/公众号/简书/豆瓣）。</li>
      <li>打开 <b>AIPDD Enterprise → 工作台 → 营销工具 → 多平台内容分发</b>。</li>
      <li>在内容台账点「分发」，插件会自动打开各平台创作页填充并发布。</li>
      <li>「仅填充」模式下请回到平台页人工确认后再点发布。</li>
    </ol>
    <div class="tip">发布结果会自动回写到台账；填充失败时标签页会保留，可在工具页「人工补记」。</div>
    <div class="trust">
      <div class="trust-row">
        <span>当前站点</span>
        <span class="trust-origin" id="origin">—</span>
      </div>
      <button id="trustBtn" class="trust-btn" type="button" disabled>加载中…</button>
      <div class="trust-status" id="status">只有信任的站点才能触发插件分发（安全默认）。</div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
