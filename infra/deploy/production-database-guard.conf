# Install as /etc/systemd/system/aiworkin-enterprise-api.service.d/10-database-guard.conf.
# For the future standalone Worker, install the same drop-in under its own unit.
# Run systemctl daemon-reload after installation; a running service does not need restarting.
[Service]
ExecStartPre=/www/wwwroot/aiworkin-enterprise/runtime/node-v24.10.0-linux-x64/bin/node /www/wwwroot/aiworkin-enterprise/runtime/production-guards/production-database.mjs check --backend-dir /www/wwwroot/aiworkin-enterprise/current/backend --env-file /www/wwwroot/aiworkin-enterprise/shared/backend.env.production
