# Include inside nginx http {}. Replace server_name and TLS settings for deployment.
server {
    listen 15889;
    server_name localhost;
    client_max_body_size 16m;
    proxy_read_timeout 95s;
    location /api/ {
        proxy_pass http://127.0.0.1:1690;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # Agent 对话是 SSE：不缓冲，首字节立刻到浏览器（长生成按 300s 给足）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    # 内容创作用的素材上传（单件 100MB）：只放这一条路径的体积，其余仍是 16m
    location /api/backend/enterprise/content/uploads {
        proxy_pass http://127.0.0.1:1690;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:15890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
